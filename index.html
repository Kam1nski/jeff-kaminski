<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeff_Kaminski — Twitch</title>
<meta name="description" content="Retro wave streams on Twitch">
<meta name="theme-color" content="#0b0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Yellowtail&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== Цвета: поменяешь здесь, поменяется везде ===== */
  :root {
    --bg1: #0b0820;
    --bg2: #24104a;
    --pink: #ff2fb3;
    --cyan: #22d3ee;
    --text: #f4ecff;
    --muted: #b9a8d9;
    --palm: #1a0b38;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg1);
    overflow-x: hidden;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 0 18px; }
  .icon { width: 1em; height: 1em; flex: 0 0 auto; }

  /* ===== Переключатель языка (только наверху, не едет за прокруткой) ===== */
  .lang { position: absolute; top: 14px; right: 14px; z-index: 5; display: flex; gap: 4px;
          background: rgba(11, 8, 32, .6); border: 1px solid rgba(34, 211, 238, .5);
          border-radius: 999px; padding: 3px; }
  .lang button {
    font: 500 12px 'Rubik', sans-serif; color: var(--muted);
    background: none; border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer;
  }
  .lang button.active { background: var(--cyan); color: var(--bg1); }

  /* ===== Первый экран ===== */
  .hero {
    position: relative; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, #07051a 0%, #1d0b45 70%, #3a1366 100%) top / 100% 270px no-repeat, var(--bg1);
  }
  .scene { position: relative; height: 430px; max-width: 620px; margin: 0 auto; }

  .titles { position: absolute; top: 58px; left: 0; right: 0; z-index: 3; }

  /* Хромированная надпись */
  .name {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(38px, 11.5vw, 64px); line-height: 1; letter-spacing: -.5px;
    background: linear-gradient(180deg, #ffffff 0%, #e4ecff 38%, #8f86d8 49%, #2b1f63 51%, #b98cff 66%, #ffd3f4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(255, 255, 255, .35);
    filter: drop-shadow(0 2px 0 #4b1b8a) drop-shadow(0 0 14px rgba(255, 47, 179, .55));
  }
  .tagline {
    font-family: 'Yellowtail', cursive; font-weight: 400;
    font-size: clamp(32px, 9vw, 46px); line-height: 1; margin-top: 2px;
    color: #ffd9f2; transform: rotate(-4deg);
    text-shadow: 0 0 4px #fff, 0 0 10px var(--pink), 0 0 22px var(--pink), 0 0 40px var(--pink);
  }

  /* Солнце с полосками */
  .sun {
    position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 1;
    width: 230px; height: 230px; border-radius: 50%;
    background: linear-gradient(180deg, #ffe08a 0%, #ff9a52 45%, #ff3d9a 100%);
    box-shadow: 0 0 70px rgba(255, 61, 154, .6), 0 0 140px rgba(255, 122, 89, .35);
    -webkit-mask: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 62%, transparent 62% 67%,
                                  #000 67% 72%, transparent 72% 78%, #000 78% 83%, transparent 83% 90%, #000 90%);
            mask: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 62%, transparent 62% 67%,
                                  #000 67% 72%, transparent 72% 78%, #000 78% 83%, transparent 83% 90%, #000 90%);
  }

  /* Пальмы */
  .palm { position: absolute; bottom: 160px; z-index: 2; fill: var(--palm); }
  .palm.p1 { left: -18px; width: 120px; height: 230px; }
  .palm.p2 { left: 58px; width: 70px; height: 140px; opacity: .8; }
  .palm.p3 { right: -14px; width: 110px; height: 215px; transform: scaleX(-1); }
  .palm.p4 { right: 64px; width: 64px; height: 125px; opacity: .8; transform: scaleX(-1); }

  /* Неоновая сетка до горизонта */
  .floor {
    position: absolute; left: 50%; width: 100vw; margin-left: -50vw; bottom: 0; height: 160px; z-index: 2;
    overflow: hidden; perspective: 300px;
    border-top: 2px solid var(--pink); box-shadow: 0 -6px 26px rgba(255, 47, 179, .8);
    background: linear-gradient(180deg, #2a0d4f, var(--bg1));
  }
  .floor::before {
    content: ""; position: absolute; left: -100%; right: -100%; top: 0; height: 250px;
    background-image:
      linear-gradient(rgba(255, 47, 179, .75) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255, 47, 179, .75) 2px, transparent 2px);
    background-size: 46px 46px; background-position: center top;
    transform: rotateX(62deg); transform-origin: top;
    animation: drive 2.2s linear infinite;
  }
  .floor::after {   /* затемнение к горизонту */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(42, 13, 79, .9) 0%, transparent 40%);
  }
  @keyframes drive { to { background-position: center 46px; } }
  @media (prefers-reduced-motion: reduce) { .floor::before { animation: none; } }

  .cta { position: relative; z-index: 4; margin-top: -40px; padding: 0 18px 34px; }
  .note { color: var(--muted); margin-top: 14px; font-size: 15px; }

  /* Главная кнопка */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font: 700 17px 'Rubik', sans-serif; letter-spacing: .8px; text-transform: uppercase;
    color: #fff; text-decoration: none;
    background: linear-gradient(180deg, #ff4fc4, #e010a0);
    padding: 16px 30px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35);
    box-shadow: 0 0 16px var(--pink), 0 0 42px rgba(255, 47, 179, .55), inset 0 1px 0 rgba(255, 255, 255, .4);
    transition: transform .2s;
  }
  .btn .icon { font-size: 22px; }
  .btn:hover { transform: scale(1.04); }

  /* ===== О себе ===== */
  .about { display: flex; gap: 20px; align-items: center; margin: 34px 0 46px; }
  .avatar {
    width: 128px; height: 128px; flex: 0 0 128px; border-radius: 50%; overflow: hidden;
    padding: 4px; background: linear-gradient(135deg, var(--cyan), var(--pink));
    box-shadow: 0 0 22px rgba(34, 211, 238, .6), 0 0 34px rgba(255, 47, 179, .4);
  }
  .avatar > * {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: flex;
    align-items: center; justify-content: center; background: var(--bg2);
    font-family: 'Russo One', sans-serif; font-size: 52px; color: var(--pink);
  }
  .about p { font-size: 16px; line-height: 1.5; }
  @media (max-width: 380px) {
    .about { flex-direction: column; text-align: center; }
  }

  /* ===== Заголовки блоков ===== */
  .title {
    font-family: 'Russo One', sans-serif; font-size: 30px; text-align: center; text-transform: uppercase;
    color: #8ff1ff; text-shadow: 0 0 6px var(--cyan), 0 0 18px var(--cyan); margin-bottom: 18px;
  }

  /* ===== Сетап: 3 колонки всегда ===== */
  .setup { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card {
    border: 2px solid transparent; border-radius: 14px; padding: 16px 6px 12px; text-align: center;
    background: linear-gradient(#120b2c, #120b2c) padding-box,
                linear-gradient(135deg, var(--cyan), var(--pink)) border-box;
    box-shadow: 0 0 14px rgba(34, 211, 238, .25), 0 0 14px rgba(255, 47, 179, .2);
  }
  .card .icon { font-size: 40px; color: #c6a8ff; filter: drop-shadow(0 0 4px var(--pink)); }
  .card b { display: block; margin-top: 8px; font-size: 13px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase; }
  .card span { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 1em; }

  /* ===== Соцсети ===== */
  .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 44px 0 10px; }
  .social {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 10px; border-radius: 999px; font-size: 17px; font-weight: 500;
    border: 2px solid var(--cyan); color: var(--text); text-decoration: none;
    background: rgba(11, 8, 32, .6);
    box-shadow: 0 0 12px rgba(34, 211, 238, .45), inset 0 0 10px rgba(34, 211, 238, .15);
    transition: background .2s;
  }
  .social .icon { font-size: 22px; color: var(--cyan); }
  .social.pink { border-color: var(--pink); box-shadow: 0 0 12px rgba(255, 47, 179, .45), inset 0 0 10px rgba(255, 47, 179, .15); }
  .social.pink .icon { color: var(--pink); }
  .social:hover { background: rgba(255, 255, 255, .06); }

  /* ===== Финальная кнопка на фоне солнца ===== */
  .final { position: relative; text-align: center; padding: 70px 0 60px; }
  .final::before {
    content: ""; position: absolute; left: 50%; top: 22px; transform: translateX(-50%);
    width: 150px; height: 150px; border-radius: 50%;
    background: linear-gradient(180deg, #ffd166, #ff7a59 50%, #ff2fb3);
    box-shadow: 0 0 50px rgba(255, 47, 179, .5);
    -webkit-mask: linear-gradient(180deg, #000 0 55%, transparent 55% 60%, #000 60% 68%, transparent 68% 74%, #000 74% 82%, transparent 82% 90%, #000 90%);
            mask: linear-gradient(180deg, #000 0 55%, transparent 55% 60%, #000 60% 68%, transparent 68% 74%, #000 74% 82%, transparent 82% 90%, #000 90%);
  }
  .final .btn { position: relative; }

  footer {
    text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0 30px;
    border-top: 1px solid var(--pink); box-shadow: 0 -1px 12px rgba(255, 47, 179, .5);
  }
  .page { background: linear-gradient(180deg, var(--bg1) 0%, #1a0b3d 50%, var(--bg1) 100%); }
</style>
</head>
<body>

  <!-- ===== Первый экран ===== -->
  <header class="hero">
    <div class="lang">
      <button data-lang="ru">RU</button>
      <button data-lang="en">EN</button>
    </div>

    <div class="scene">
      <div class="titles">
        <h1 class="name">Jeff_Kaminski</h1>
        <p class="tagline" data-i18n="tagline">Retro wave streams</p>
      </div>
      <div class="sun"></div>
      <svg class="palm p1"><use href="#i-palm"/></svg>
      <svg class="palm p2"><use href="#i-palm"/></svg>
      <svg class="palm p3"><use href="#i-palm"/></svg>
      <svg class="palm p4"><use href="#i-palm"/></svg>
      <div class="floor"></div>
    </div>

    <div class="cta">
      <a class="btn" href="https://www.twitch.tv/Jeff_Kaminski" target="_blank" rel="noopener">
        <span data-i18n="watch">Смотреть на Twitch</span>
        <svg class="icon"><use href="#i-twitch"/></svg>
      </a>
      <p class="note" data-i18n="note">Стримлю по вечерам</p>
    </div>
  </header>

  <div class="page">
  <main class="wrap">

    <!-- ===== О себе ===== -->
    <section class="about">
      <!-- Когда будет фото: замени <div>J</div> на <img src="photo.jpg" alt="Jeff"> -->
      <div class="avatar"><div>J</div></div>
      <p data-i18n="about">Привет, я Джефф. Здесь будет текст о себе.</p>
    </section>

    <!-- ===== Сетап. Модели впиши вместо прочерков ===== -->

      <h2 class="title" data-i18n="setupTitle">Мой сетап</h2>
      <div class="setup">
        <div class="card"><svg class="icon"><use href="#i-cpu"/></svg><b data-i18n="cpu">Процессор</b><span>—</span></div>
        <div class="card"><svg class="icon"><use href="#i-gpu"/></svg><b data-i18n="gpu">Видеокарта</b><span>—</span></div>
        <div class="card"><svg class="icon"><use href="#i-mic"/></svg><b data-i18n="mic">Микрофон</b><span>—</span></div>
        <div class="card"><svg class="icon"><use href="#i-mouse"/></svg><b data-i18n="mouse">Мышь</b><span>—</span></div>

<script>
  // ===== Все тексты сайта на двух языках =====
  const texts = {
    ru: {
      tagline: "Retro wave streams",
      watch: "Смотреть на Twitch",
      note: "Стримлю по вечерам",
      about: "Привет, я Джефф. Здесь будет текст о себе.",
      setupTitle: "Мой сетап",
      cpu: "Процессор", gpu: "Видеокарта", mic: "Микрофон",
      mouse: "Мышь", keyboard: "Клавиатура", headset: "Наушники"
    },
    en: {
      tagline: "Retro wave streams",
      watch: "Watch on Twitch",
      note: "Streams in the evenings",
      about: "Hi, I'm Jeff. A few words about me will be here.",
      setupTitle: "My setup",
      cpu: "CPU", gpu: "GPU", mic: "Mic",
      mouse: "Mouse", keyboard: "Keyboard", headset: "Headset"
    }
  };

  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const text = texts[lang][el.dataset.i18n];
      if (text) el.textContent = text;
    });
    document.querySelectorAll(".lang button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    try { localStorage.setItem("lang", lang); } catch (e) {}
  }

  document.querySelectorAll(".lang button").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });

  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  setLang(saved || ((navigator.language || "").startsWith("ru") ? "ru" : "en"));
</script>
