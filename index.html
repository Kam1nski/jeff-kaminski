<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeff_Kaminski — Twitch</title>
<meta name="description" content="Retro wave streams on Twitch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Marck+Script&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== Цвета: поменяешь здесь, поменяется везде ===== */
  :root {
    --bg1: #0b0820;
    --bg2: #2a0f4f;
    --pink: #ff2fb3;
    --cyan: #22d3ee;
    --text: #f4ecff;
    --muted: #b9a8d9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg1) 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  /* ===== Переключатель языка ===== */
  .lang { position: fixed; top: 14px; right: 14px; z-index: 10; display: flex; gap: 6px; }
  .lang button {
    font: inherit; font-size: 13px; color: var(--text);
    background: rgba(11, 8, 32, .75); border: 1px solid var(--cyan);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .lang button.active { background: var(--cyan); color: var(--bg1); }

  /* ===== Первый экран ===== */
  .hero { text-align: center; padding: 70px 20px 40px; overflow: hidden; }

  .name {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(34px, 10vw, 58px);
    background: linear-gradient(180deg, #ffffff 0%, #c9d6ff 45%, #6b5bd6 52%, #f2c6ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 47, 179, .6));
  }

  .tagline {
    font-family: 'Marck Script', cursive;
    font-size: clamp(26px, 7vw, 38px);
    color: var(--pink);
    text-shadow: 0 0 8px var(--pink), 0 0 20px var(--pink);
  }

  /* Ретро-закат и неоновая сетка */
  .scene { position: relative; height: 190px; margin: 10px auto 0; max-width: 560px; }
  .sun {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 180px; height: 180px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(180deg, #ffd166, #ff7a59 45%, #ff2fb3);
    box-shadow: 0 0 60px rgba(255, 47, 179, .55);
  }
  .sun::after {
    content: ""; position: absolute; left: 0; right: 0; top: 55%; bottom: 0;
    background: repeating-linear-gradient(180deg, transparent 0 10px, var(--bg2) 10px 15px);
  }
  .grid {
    position: absolute; left: -50%; right: -50%; bottom: 0; height: 100px;
    background-color: var(--bg1);
    background-image:
      linear-gradient(rgba(255, 47, 179, .7) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 47, 179, .7) 1px, transparent 1px);
    background-size: 40px 22px;
    border-top: 2px solid var(--pink);
    box-shadow: 0 -4px 24px var(--pink);
    transform: perspective(160px) rotateX(50deg);
    transform-origin: bottom;
  }

  /* Главная кнопка */
  .btn {
    position: relative; display: inline-block;
    font-family: 'Russo One', sans-serif; font-size: 18px; letter-spacing: 1px;
    color: #fff; text-decoration: none;
    background: var(--pink); padding: 16px 34px; border-radius: 999px;
    box-shadow: 0 0 18px var(--pink), 0 0 40px rgba(255, 47, 179, .5);
    transition: transform .2s;
  }
  .btn:hover { transform: scale(1.05); }
  .hero .btn { margin-top: 24px; }
  .note { color: var(--muted); margin-top: 14px; font-size: 15px; }

  /* ===== О себе ===== */
  .about { display: flex; gap: 18px; align-items: center; margin: 40px 0; }
  .avatar {
    flex: 0 0 120px; height: 120px; border-radius: 50%; overflow: hidden;
    border: 3px solid var(--cyan);
    box-shadow: 0 0 20px var(--cyan), inset 0 0 20px var(--pink);
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Russo One', sans-serif; font-size: 48px; color: var(--pink);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  @media (max-width: 400px) { .about { flex-direction: column; text-align: center; } }

  /* ===== Заголовки блоков ===== */
  .title {
    font-family: 'Russo One', sans-serif; font-size: 28px; text-align: center;
    color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin-bottom: 18px;
  }

  /* ===== Сетап ===== */
  .setup { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card {
    border: 2px solid var(--cyan); border-radius: 14px; padding: 16px 8px; text-align: center;
    background: rgba(11, 8, 32, .6); box-shadow: 0 0 12px rgba(34, 211, 238, .35);
  }
  .card:nth-child(even) { border-color: var(--pink); box-shadow: 0 0 12px rgba(255, 47, 179, .35); }
  .card b { display: block; font-family: 'Russo One', sans-serif; font-size: 15px; }
  .card span { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 420px) { .setup { grid-template-columns: repeat(2, 1fr); } }

  /* ===== Соцсети ===== */
  .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 40px 0; }
  .social {
    display: block; text-align: center; padding: 14px; border-radius: 999px;
    border: 2px solid var(--cyan); color: var(--text); text-decoration: none; font-weight: 500;
    box-shadow: 0 0 12px rgba(34, 211, 238, .35); transition: background .2s;
  }
  .social:nth-child(2), .social:nth-child(3) {
    border-color: var(--pink); box-shadow: 0 0 12px rgba(255, 47, 179, .35);
  }
  .social:hover { background: rgba(255, 255, 255, .06); }

  /* ===== Финал и подвал ===== */
  .final { text-align: center; padding: 20px 0 50px; }
  footer {
    text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0 30px;
    border-top: 1px solid var(--pink); box-shadow: 0 -1px 10px rgba(255, 47, 179, .4);
  }
</style>
</head>
<body>

  <div class="lang">
    <button data-lang="ru">RU</button>
    <button data-lang="en">EN</button>
  </div>

  <header class="hero">
    <h1 class="name">Jeff_Kaminski</h1>
    <p class="tagline" data-i18n="tagline">Retro wave streams</p>
    <div class="scene">
      <div class="sun"></div>
      <div class="grid"></div>
    </div>
    <a class="btn" href="https://www.twitch.tv/Jeff_Kaminski" target="_blank" rel="noopener" data-i18n="watch">Смотреть на Twitch</a>
    <p class="note" data-i18n="note">Стримлю по вечерам, анонсы в Telegram</p>
  </header>

  <main class="wrap">

    <section class="about">
      <!-- Когда будет фото: замени букву J на <img src="photo.jpg" alt="Jeff"> -->
      <div class="avatar">J</div>
      <p data-i18n="about">Привет, я Джефф. Здесь будет текст о себе.</p>
    </section>

    <section>
      <h2 class="title" data-i18n="setupTitle">Мой сетап</h2>
      <div class="setup">
        <div class="card"><b data-i18n="cpu">Процессор</b><span>—</span></div>
        <div class="card"><b data-i18n="gpu">Видеокарта</b><span>—</span></div>
        <div class="card"><b data-i18n="mic">Микрофон</b><span>—</span></div>
        <div class="card"><b data-i18n="mouse">Мышь</b><span>—</span></div>
        <div class="card"><b data-i18n="keyboard">Клавиатура</b><span>—</span></div>
        <div class="card"><b data-i18n="headset">Наушники</b><span>—</span></div>
      </div>
    </section>

    <!-- Ссылки: замени # на свои адреса -->
    <section class="socials">
      <a class="social" href="#" target="_blank" rel="noopener">Telegram</a>
      <a class="social" href="#" target="_blank" rel="noopener">Instagram</a>
      <a class="social" href="#" target="_blank" rel="noopener">YouTube</a>
      <a class="social" href="#" target="_blank" rel="noopener">TikTok</a>
    </section>

    <section class="final">
      <a class="btn" href="https://www.twitch.tv/Jeff_Kaminski" target="_blank" rel="noopener" data-i18n="watch">Смотреть на Twitch</a>
    </section>

  </main>

  <footer>© Jeff_Kaminski</footer>

<script>
  // ===== Все тексты сайта на двух языках =====
  const texts = {
    ru: {
      tagline: "Retro wave streams",
      watch: "Смотреть на Twitch",
      note: "Стримлю по вечерам, анонсы в Telegram",
      about: "Привет, я Джефф. Здесь будет текст о себе.",
      setupTitle: "Мой сетап",
      cpu: "Процессор", gpu: "Видеокарта", mic: "Микрофон",
      mouse: "Мышь", keyboard: "Клавиатура", headset: "Наушники"
    },
    en: {
      tagline: "Retro wave streams",
      watch: "Watch on Twitch",
      note: "Evening streams, announcements in Telegram",
      about: "Hi, I'm Jeff. A few words about me will be here.",
      setupTitle: "My setup",
      cpu: "CPU", gpu: "GPU", mic: "Microphone",
      mouse: "Mouse", keyboard: "Keyboard", headset: "Headset"
    }
  };

  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const text = texts[lang][el.dataset.i18n];
      if (text) el.textContent = text;
    });
    document.querySelectorAll(".lang button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    try { localStorage.setItem("lang", lang); } catch (e) {}
  }

  document.querySelectorAll(".lang button").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });

  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  setLang(saved || (navigator.language.startsWith("ru") ? "ru" : "en"));
</script>
</body>
</html>
